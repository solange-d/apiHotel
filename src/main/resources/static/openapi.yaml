              example:
                nome: Alan Maier
                documento: DOC-123
                email: alan@example.com
                telefone: '47999999999'
                id: 1
          headers:
            Location:
              description: URI relativa do recurso criado.
              schema:
                type: string
              example: /api/v1/hospedes/1
      requestBody:
        required: true
