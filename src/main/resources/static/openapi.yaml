components:
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT
  schemas:
    HospedeRequest:
      type: object
      required:
      - nome
      - documento
      - email
      - telefone
      properties:
        nome:
          type: string
          minLength: 1
          maxLength: 120
        documento:
          type: string
          minLength: 1
          maxLength: 30
        email:
          type: string
          format: email
          maxLength: 254
        telefone:
          type: string
          minLength: 1
          maxLength: 30
    HospedeResponse:
      type: object
      required:
      - nome
      - documento
      - email
      - telefone
      - id
      properties:
        nome:
          type: string
