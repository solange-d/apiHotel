openapi: 3.0.3
info:
  title: API Hotel
  version: 0.0.1
  description: 20 endpoints CRUD, cancelamento, estorno e login JWT. Valores monetários
    em reais. Datas ISO 8601.
servers:
- url: http://localhost:8080
security:
- bearerAuth: []
paths:
  /api/v1/hospedes:
    get:
      tags:
      - hospedes
      operationId: getHospedeLista
      summary: Listar hospedes
      responses:
        '400':
          description: Dados ou parâmetros inválidos.
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/ProblemDetail'
              example:
                type: about:blank
                title: Bad Request
                status: 400
                detail: JSON, parâmetro, data ou enum inválido.
        '401':
          description: Token ausente/inválido, ou credenciais de login incorretas.
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/ProblemDetail'
              example:
                type: about:blank
                title: Unauthorized
                status: 401
                detail: Credenciais ausentes ou inválidas.
          headers:
            WWW-Authenticate:
              schema:
                type: string
              example: Bearer
              description: Desafio Bearer.
        '403':
          description: Perfil sem permissão.
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/ProblemDetail'
              example:
                type: about:blank
                title: Forbidden
                status: 403
                detail: Perfil sem permissão para esta operação.
        '404':
          description: Recurso ausente ou logicamente excluído.
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/ProblemDetail'
              example:
                type: about:blank
                title: Not Found
                status: 404
                detail: Hospede não encontrado.
        '409':
          description: Duplicidade, concorrência ou regra de negócio impede a operação.
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/ProblemDetail'
              example:
                type: about:blank
                title: Conflict
                status: 409
                detail: Alteração simultânea. Refaça a operação.
        '500':
          description: Falha inesperada, sem detalhes internos.
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/ProblemDetail'
              example:
                type: about:blank
                title: Internal Server Error
                status: 500
                detail: Falha interna ao processar a solicitação.
        '200':
          description: Sucesso.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PaginaHospede'
              example:
                content:
                - nome: Alan Maier
                  documento: DOC-123
                  email: alan@example.com
                  telefone: '47999999999'
                  id: 1
                pageable:
                  pageNumber: 0
                  pageSize: 20
                  sort:
                    empty: false
                    sorted: true
                    unsorted: false
                  offset: 0
                  paged: true
                  unpaged: false
                totalElements: 1
                totalPages: 1
                last: true
                size: 20
                number: 0
                sort:
                  empty: false
                  sorted: true
                  unsorted: false
                numberOfElements: 1
                first: true
                empty: false
      parameters:
      - name: pagina
        in: query
        required: false
        schema:
          type: integer
          minimum: 0
          default: 0
        example: 0
      - name: tamanho
        in: query
        required: false
        schema:
          type: integer
          minimum: 1
          maximum: 100
          default: 20
        example: 20
      - name: ordenarPor
        in: query
        required: false
        schema:
          type: string
          enum:
          - id
          - nome
          - documento
          - email
          default: id
        example: id
      - name: direcao
        in: query
        required: false
        schema:
          type: string
          enum:
          - asc
          - desc
          default: asc
        example: asc
      - name: nome
        in: query
        required: false
        schema:
          type: string
        description: Contém, sem diferenciar maiúsculas/minúsculas.
        example: Alan
      - name: documento
        in: query
        required: false
        schema:
          type: string
        description: Igualdade exata após trim.
        example: DOC-123
      - name: email
        in: query
        required: false
        schema:
          type: string
        description: Igualdade sem diferenciar maiúsculas/minúsculas.
        example: alan@example.com
    post:
      tags:
      - hospedes
      operationId: postHospedeLista
      summary: Criar hospede
      responses:
        '400':
          description: Dados ou parâmetros inválidos.
          content:
            application/problem+json:
